send_notification:
  name: Send Notification
  description: Send a notification through the ANS (Advanced Notification System) with configurable criticality and delivery channels.
  fields:
    source:
      name: Source
      description: Originator of the notification (e.g. "home_assistant", "security_system"). Used for filtering and logging.
      required: true
      example: "home_assistant"
      selector:
        text:
    title:
      name: Title
      description: The subject line of the notification.
      required: true
      example: "Door Opened"
      selector:
        text:
    message:
      name: Message
      description: The main body text of the notification.
      required: true
      example: "Front door was opened at 3:45 PM"
      selector:
        text:
    type:
      name: Type
      description: Category of the notification, used for delivery filtering and routing.
      required: true
      example: "SECURITY"
      selector:
        select:
          options:
            - label: Information
              value: INFO
            - label: Warning
              value: WARNING
            - label: Alert
              value: ALERT
            - label: Reminder
              value: REMINDER
            - label: Event
              value: EVENT
            - label: Security
              value: SECURITY
    criticality:
      name: Criticality
      description: Priority level of the notification, used for delivery filtering and channel selection.
      required: true
      example: "HIGH"
      selector:
        select:
          options:
            - label: Low
              value: LOW
            - label: Medium
              value: MEDIUM
            - label: High
              value: HIGH
            - label: Critical
              value: CRITICAL
    image:
      name: Image
      required: false
      description: >
        Image to include with the notification.
        Accepts an http/https URL or an HA-relative path starting with /
        (e.g. /local/snapshot.jpg, /api/camera_proxy/camera.front_door).
        Mobile app: http/https only — local paths are not forwarded to push servers.
        Persistent notification: an http/https URL renders as a clickable filename link;
        a local path renders as an inline Markdown image embed.
        Signal: forwarded as an attachment or URL.
        URLs without a file path segment (e.g. bare domain) are ignored with a warning.
      example: "https://example.com/snapshot.jpg"
      selector:
        text:
    video:
      name: Video
      required: false
      description: >
        Video file to include with the notification.
        Accepts an http/https URL or an HA-relative path starting with /.
        Rendered as a clickable filename link in persistent notifications.
        Forwarded as an attachment or URL in Signal.
        Not supported by the mobile app adapter.
        URLs without a file path segment (e.g. bare domain) are ignored with a warning.
      example: "https://example.com/clip.mp4"
      selector:
        text:
    file:
      name: File
      required: false
      description: >
        File to include with the notification.
        Accepts an http/https URL or an HA-relative path starting with /.
        Rendered as a clickable filename link in persistent notifications.
        Forwarded as an attachment or URL in Signal.
        Not supported by the mobile app adapter.
        URLs without a file path segment (e.g. bare domain) are ignored with a warning.
      example: "https://example.com/report.pdf"
      selector:
        text:
    link:
      name: Link
      required: false
      description: >
        HTTP/HTTPS URL for the notification tap action.
        Mobile app: sets data.url (iOS/macOS) and data.clickAction (Android).
        Persistent notification: rendered as a [Details] link in the message body.
        Signal: appended to the message.
        Takes priority over context.entity for the mobile tap destination.
      example: "https://example.com/dashboard"
      selector:
        text:
    context:
      name: Context
      required: false
      description: >
        Semantic metadata to attach to this notification.
        Use the entity key to associate a subject HA entity (e.g. binary_sensor.front_door):
        the mobile app uses it as the tap destination (entityId deep-link) when no link is set,
        and persistent notifications auto-link any context value that matches a known entity ID.
        Additional keys (camera, zone, device, ...) are appended to the notification body.
      example: "entity: binary_sensor.front_door\ncamera: front_entrance"
      selector:
        object:
    actions:
      name: Action Buttons
      required: false
      description: >
        Action buttons to display on the notification (mobile app only, maximum 3).
        Each entry requires an action identifier and a title label; uri is optional.
        When tapped, the companion app fires a mobile_app_notification_action event
        with the action value, which automations can listen for.
        Ignored by Signal, TTS, and persistent notification channels.
      example:
        - action: open_door
          title: Open Door
          uri: "homeassistant://navigate/lovelace"
        - action: dismiss
          title: Dismiss
      selector:
        object:
    channel_data:
      name: Channel Data (Advanced)
      required: false
      description: >
        Flat dict of adapter-specific delivery overrides merged on top of the standard fields.
        Signal and TTS read only the keys they recognise and ignore the rest.

        Mobile app is the exception: channel_data is merged directly into the HA Companion
        App payload, so any Companion App data key is forwarded, not just the common ones
        listed below — see docs/channels.md for the full reference. Because it's a raw merge,
        an unlisted or mistyped key is not silently dropped; it takes effect as sent.

        Mobile app keys (most common): tag, importance, channel, vibrationPattern, sound,
        badge, sticky, persistent, alert_once, car_ui, subtitle.

        Signal keys (exhaustive): text_mode ("normal"/"styled"), attachments (list of local paths),
        urls (list of URL attachments), verify_ssl (bool).
      example: "tag: motion-front-door\nimportance: high"
      selector:
        object:
refresh_channels:
  name: Refresh Channels
  description: >
    Manually trigger a full re-detection of notify.* services and media_player.* entities
    and rebuild the active adapter set. ANS auto-detects channel changes at runtime
    (new notify service, media player added/removed), so this service is only needed
    as a manual fallback when auto-detection has not picked up a change or for debugging.
  fields: {}