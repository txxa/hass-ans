name: "Test"

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  pytest:
    name: "Pytest"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v7.0.0"

        - name: "Set up Python"
          uses: actions/setup-python@v6.3.0
          with:
            python-version: "3.14"
            cache: "pip"

        - name: "Install requirements"
          run: python3 -m pip install -r requirements-test.txt

        - name: "Run tests"
          env:
            PYTHONPATH: ${{ github.workspace }}/custom_components
          run: python3 -m pytest --cov=custom_components/ans --cov-report=term-missing --cov-report=xml

        - name: "Upload coverage report"
          if: always()
          uses: actions/upload-artifact@v7
          with:
            name: coverage-report
            path: coverage.xml
